# ==========================================
# PRODUCTION PROFILE - Optimized for Cloud Run
# ==========================================
# This file is loaded when SPRING_PROFILES_ACTIVE=prod

# 1. Logging - Balanced for Cloud Logging costs
logging.level.com.seo.project=ERROR
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.orm.deprecation=ERROR

# 2. Server & Security (Hardened for HTTPS)
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# 3. Actuator - Monitoring & Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
management.health.db.enabled=false
management.health.redis.enabled=false
management.health.ping.enabled=true
management.metrics.enable.all=false

# 4. Web Performance (Compression & Protocols)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.http2.enabled=true

# 5. Resource Optimization
spring.web.resources.chain.compressed=true
spring.web.resources.chain.cache=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.thymeleaf.enable-spring-el-compiler=true

# 6. Cold Start & Serverless Optimizations
spring.main.lazy-initialization=true
spring.devtools.restart.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.flyway.validate-on-migrate=false

# Connection test: lightweight heartbeat query
spring.datasource.hikari.connection-test-query=SELECT 1
