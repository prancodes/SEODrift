# ==========================================
# PRODUCTION PROFILE - Optimized for Cloud Run
# ==========================================
# This file is loaded when SPRING_PROFILES_ACTIVE=prod

# 1. Logging - Balanced for Cloud Logging costs
logging.level.com.seo.project=ERROR
logging.level.org.springframework.security=WARN

# 2. Server & Security (Hardened for HTTPS)
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# 3. Actuator - Monitoring & Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
management.health.db.enabled=false
management.health.redis.enabled=false
management.health.ping.enabled=true
management.metrics.enable.all=false
spring.flyway.enabled=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# 4. Web Performance (Compression & Protocols)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.http2.enabled=true

# 5. Resource Optimization
spring.web.resources.chain.compressed=true
spring.web.resources.chain.cache=true

# 6. Cold Start & Serverless Optimizations
spring.main.lazy-initialization=true
spring.devtools.restart.enabled=false

# 7. Hikari Connection Pool (Optimized for Cloud Run 2vCPU + Neon DB)
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
# Don't block Spring startup if DB is cold (Neon auto-sleep) - connect lazily
spring.datasource.hikari.initialization-fail-timeout=0
# Connection test: lightweight heartbeat query
spring.datasource.hikari.connection-test-query=SELECT 1
