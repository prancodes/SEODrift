# ==========================================
# BASE APPLICATION CONFIGURATION
# ==========================================
# Profile-specific configs are in:
#   - application-dev.properties (development)
#   - application-prod.properties (production)

# Default active profile (can be overridden by environment variable)

# Application Name
spring.application.name=SEODrift
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.mvc.servlet.load-on-startup=1

# 0. Actuator & Observability
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.tags.application=${spring.application.name}

# 1. Server Configuration
server.port=${PORT:8080}
server.servlet.session.timeout=6h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.session.data.redis.repository-type=default
spring.session.data.redis.namespace=seodrift:session
spring.session.data.redis.flush-mode=on_save

# 2. Database Configuration (Shared Neon.tech)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP base defaults (overridden per-profile)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=lazy

# 4. Security & OAuth2 (Google Console)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid,https://www.googleapis.com/auth/youtube.readonly,https://www.googleapis.com/auth/youtube.upload,https://www.googleapis.com/auth/yt-analytics.readonly

# 5. Application Properties (Custom)
youtube.api.key=${YT_API_KEY}
base.url=${BASE_URL:https://www.googleapis.com/youtube/v3}
app.base-url=${APP_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.form-filter.enabled=false

# 6. Redis Caching Configuration
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}
spring.data.redis.repositories.enabled=false

# 6b. Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 7. Global Defaults
spring.thymeleaf.cache=true
logging.level.root=INFO

# 8. Spring AI Google GenAI (Gemini) Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL}

# 9. Suppress Chatty Logs
logging.level.io.lettuce.core.protocol=WARN
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR
logging.level.org.flywaydb=INFO

# 10. File Upload Settings
spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB
spring.servlet.multipart.location=${user.home}/.seodrift/uploads
server.tomcat.max-post-size=-1
server.tomcat.max-swallow-size=-1

# 11. Security Token Encryption
app.security.oauth2.encrypt-key=${OAUTH2_ENCRYPT_KEY}
app.security.oauth2.encrypt-salt=${OAUTH2_ENCRYPT_SALT}

# 12. Email / SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 13. SaaS Monetization (Dodo Payments)
dodo.payments.api.key=${DODO_PAYMENTS_API_KEY:}
dodo.payments.product.pro-id=${DODO_PRO_PRODUCT_ID:}
dodo.payments.environment=${DODO_ENVIRONMENT:live}
dodo.payments.webhook.secret=${DODO_WEBHOOK_SECRET:}

